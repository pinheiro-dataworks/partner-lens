[project]
name = "partnerlens"
version = "0.1.0"
description = "Seller segmentation and partner health scoring on the Olist marketplace dataset."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, bugbear and pyupgrade.
# Line length (E501) is not enforced: the app embeds long HTML/CSS strings
# that would only become harder to read if wrapped.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
